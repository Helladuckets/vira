<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genre Studio — Vira</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin-active.css">
<style>
/* Layout only — every colour reads a Vira token, so the studio wears whatever
   skin is applied without knowing that skins exist. */
body{padding:0;overflow:hidden}
.gs{display:grid;grid-template-columns:252px 1fr;height:100dvh}
.gs-col{overflow:auto;padding:15px}
.gs-col+.gs-col{border-left:1px solid var(--line);padding:0}
.gs-left{background:var(--bg-raised)}
.gs-top{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.gs-kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-bright)}
h3.gs-h{font-size:13px;color:var(--text-head);font-weight:600}
.gs-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}
.gs-hint{font-size:11.5px;color:var(--text-dim);line-height:1.5}
.gs-sec{border-top:1px solid var(--line);padding:13px 0 4px;margin-top:11px}
.gs-sec:first-child{border-top:0;margin-top:0;padding-top:0}

/* references */
.drop{border:1px dashed var(--accent-line);border-radius:var(--radius);padding:13px;
  text-align:center;cursor:pointer;background:var(--accent-soft);margin-bottom:11px}
.drop.over{background:var(--accent-veil)}
.ref{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px}
.ref img{width:54px;height:40px;object-fit:cover;border:1px solid var(--line);border-radius:var(--radius);flex:none}
.ref-b{flex:1;min-width:0}
.ref-n{font-family:var(--mono);font-size:10px;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ref-m{font-family:var(--mono);font-size:9px;color:var(--text-faint);margin-top:2px}
.ref-pal{display:flex;height:8px;margin-top:5px;border:1px solid var(--line);
  border-radius:2px;overflow:hidden}
.ref-pal i{flex:1;display:block}
.ref-x{background:none;border:0;color:var(--text-faint);cursor:pointer;font-size:13px;padding:0 2px}
.take-tag{font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-bright);border:1px solid var(--accent-line);border-radius:2px;padding:0 3px}

/* the matrix */
/* no padding-top: the sticky header pins to the scrollport, so any top padding
   is a strip the header cannot reach and scrolled rows show through it */
.mxwrap{overflow:auto;height:100dvh;padding:0 15px 15px}
.mx{border-collapse:separate;border-spacing:0;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
/* Both axes stick, so the z order has to be stated in full: the corner cell
   sits above the header row, which sits above the frozen row-header column,
   which sits above the cells. Leaving the corner level with the body's row
   headers let a scrolled row paint straight over the reference thumbnails —
   same z-index, later in the DOM wins. */
.mx thead th{position:sticky;top:0;background:var(--bg);z-index:4;padding-top:12px;
  border-bottom:1px solid var(--accent-line)}
.mx .rowh{width:130px;font-family:var(--mono);font-size:10px;color:var(--text-dim);
  background:var(--bg);position:sticky;left:0;z-index:2}
.mx thead .rowh{z-index:5}
.rowh .rl{display:block;color:var(--text)}
.rowh .rc{display:block;font-size:8.5px;color:var(--text-faint);margin-top:2px}
.rowh .rh{display:block;font-family:var(--sans);font-size:10px;color:var(--text-faint);
  line-height:1.35;margin-top:3px}
.mx .comb-cell{background:var(--bg-raised);border-left:1px solid var(--accent-line);
  min-width:210px}
.colh{display:flex;flex-direction:column;gap:3px;min-width:132px;max-width:170px}
.colh img{width:74px;height:50px;object-fit:cover;border:1px solid var(--line);border-radius:var(--radius)}
.colh .cn{font-family:var(--mono);font-size:9px;color:var(--accent-bright);
  max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colh .cg{font-family:var(--mono);font-size:8px;color:var(--text-faint)}
.colh .cbtn{display:flex;gap:4px;margin-top:2px}
.band td{background:var(--bg-raised);padding:6px 8px}
/* the band spans every column, so its label rides sticky-left to stay readable
   once the matrix is scrolled sideways past four or five references */
.band .gs-lbl{margin:0;color:var(--accent-bright);position:sticky;left:8px;display:inline-block}
.cellv{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}

/* fragment pills. IN is filled with a check, OUT is hollow and dashed — the two
   states have to be tellable at a glance, since everything arrives checked. */
.pl{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;
  color:var(--text-faint);background:none;border:1px dashed var(--line);border-radius:999px;
  padding:3px 8px;cursor:pointer;user-select:none;line-height:1.35;text-align:left}
.pl:hover{border-color:var(--accent-line);color:var(--text)}
.pl.on{background:var(--accent-soft);border:1px solid var(--accent-bright);color:var(--accent-bright)}
.pl.on::before{content:"✓";font-size:8.5px}
.pl.na{opacity:.3;font-style:italic;cursor:default;border-style:solid}
.pl i{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.35);
  display:block;flex:none}

/* combined chips: a chip is in the genre; × takes it out */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
  color:var(--accent-bright);background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:999px;padding:3px 4px 3px 8px;line-height:1.35}
.chip.own{border-style:dashed}
.chip.acc{border-color:var(--accent-bright);box-shadow:0 0 0 1px var(--accent-line)}
.chip i{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.35);
  display:block;flex:none}
.chip .sw{cursor:pointer}
.chip .x{background:none;border:0;color:var(--accent-bright);opacity:.55;cursor:pointer;
  font-size:11px;padding:0 3px;line-height:1}
.chip .x:hover{opacity:1}
.chip .star{font-size:8px;letter-spacing:.08em}
.addpl{border:1px dashed var(--line);background:none;color:var(--text-faint);
  border-radius:999px;font-family:var(--mono);font-size:9.5px;padding:3px 9px;cursor:pointer}
.addpl:hover{color:var(--accent-bright);border-color:var(--accent-line)}
.addin{background:var(--bg-card);border:1px solid var(--accent-line);color:var(--text);
  font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:999px;min-width:130px}
.emptyc{font-family:var(--mono);font-size:9px;color:var(--text-faint);opacity:.5}

/* the combined column head */
.comb{display:flex;flex-direction:column;gap:6px;min-width:200px;max-width:240px}
.comb-img{width:100%;border:1px solid var(--accent-line);border-radius:var(--radius);
  cursor:pointer;display:block}
.comb-empty{border:1px dashed var(--line);border-radius:var(--radius);padding:18px 8px;
  font-family:var(--mono);font-size:9px;color:var(--text-faint);text-align:center;line-height:1.5}
.gen-hist{display:flex;gap:3px;flex-wrap:wrap}
.gen-hist img{width:34px;height:25px;object-fit:cover;border:1px solid var(--line);
  border-radius:2px;cursor:pointer;display:block}
.rowbtn{display:flex;gap:5px}
.comb-ptoggle{font-family:var(--mono);font-size:9px;color:var(--text-faint);cursor:pointer}
.comb-ptoggle:hover{color:var(--accent-bright)}
.comb-prompt{width:100%;min-height:104px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:9.5px;
  padding:6px;resize:vertical}

.btn2{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-contrast);background:var(--accent);border:0;border-radius:var(--radius);
  padding:8px 13px;cursor:pointer}
.btn2.ghost{background:none;color:var(--text-dim);border:1px solid var(--line)}
.btn2.sm{padding:5px 9px;font-size:9px}
.btn2:disabled{opacity:.4;cursor:default}
.empty{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;line-height:1.7}
.note{font-size:11px;color:var(--text-dim);margin-top:7px;line-height:1.5}
</style>
</head>
<body>
<div class="gs">

  <!-- ============ LEFT: references and the deliverable ============ -->
  <div class="gs-col gs-left">
    <div class="gs-top"><span class="gs-kick">Genre</span>
      <h3 class="gs-h" id="pname" contenteditable="true">Untitled genre</h3></div>

    <div class="gs-sec">
      <div class="gs-lbl">References <span id="refcount"></span></div>
      <div class="drop" id="drop">
        <div class="gs-hint">Drop images here<br>
          <span style="color:var(--text-faint)">or click to choose</span></div>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </div>
      <div id="refs"></div>
      <button class="btn2 ghost sm" id="readall" style="margin-top:6px">Read the images</button>
      <div class="gs-hint" id="visionline" style="margin-top:7px"></div>
    </div>

    <div class="gs-sec">
      <div class="gs-lbl">The genre</div>
      <div class="gs-hint" id="sumline"></div>
      <div class="rowbtn" style="margin-top:9px">
        <a class="btn2 sm" id="dl" href="#">genre.json</a>
        <button class="btn2 ghost sm" id="copyrecipe">Copy recipe</button>
      </div>
      <div class="note" id="exportnote">The recipe is the prompt; genre.json carries
        the fragments, the palette and the images beside it.</div>
    </div>
  </div>

  <!-- ============ RIGHT: the matrix ============ -->
  <div class="gs-col">
    <div class="mxwrap"><div id="mx"></div></div>
  </div>
</div>

<script>
"use strict";
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
const api=async(p,o)=>{const r=await fetch(p,o);if(!r.ok)throw new Error((await r.text()).slice(0,200));return r.json();};
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});

let GID=new URLSearchParams(location.search).get("g")||"";
let S=null;                                   // last state

async function boot(){
  if(!GID){ const p=await post("/api/genre",{name:"Untitled genre"}); GID=p.id;
    history.replaceState({},"","?g="+GID); }
  await refresh();
}
async function refresh(){ S=await api("/api/genre/"+GID); render(); }
async function patch(body){ S=await post("/api/genre/"+GID+"/patch",body); render(); }

/* what one reference currently has checked, for a row */
const checked=(rid,key)=>((S.patch.sel||{})[rid]||{})[key]||[];
/* what it offers */
const offers=(rid,key)=>((S.offers||{})[rid]||{})[key]||[];

/* ---------------- left: references ---------------- */
function renderRefs(){
  const host=$("#refs"); host.innerHTML="";
  const refs=S.patch.refs||[];
  $("#refcount").textContent=`${refs.length} / ${S.max_refs}`;
  refs.forEach(r=>{
    const row=el("div","ref");
    const img=document.createElement("img");
    img.src=`/api/genre/${GID}/reference/${r.id}/image`; img.alt="";
    row.appendChild(img);
    const b=el("div","ref-b");
    const n=el("div","ref-n",r.name||r.id);
    b.appendChild(n);
    const cov=(S.coverage||{})[r.id]||{};
    const m=el("div","ref-m",
      r.rung===2 ? `${cov.answered||0}/${cov.of||0} rows · ${cov.swatches||0} swatches`
                 : `${cov.swatches||0} swatches · not read yet`);
    b.appendChild(m);
    if(r.from_take){ const t=el("span","take-tag","take"); n.appendChild(document.createTextNode(" ")); n.appendChild(t); }
    if((r.colors||[]).length){
      const strip=el("div","ref-pal");
      r.colors.forEach(c=>{const i=el("i");i.style.background=c.hex;
        i.title=c.name+" · "+c.hex;strip.appendChild(i);});
      b.appendChild(strip);
    }
    if(r.error){ const e=el("div","ref-m",r.error); e.style.color="var(--oxidized)"; b.appendChild(e); }
    row.appendChild(b);
    const x=el("button","ref-x","✕");
    x.title="remove this reference";
    x.addEventListener("click",async()=>{S=await api(
      `/api/genre/${GID}/reference/${r.id}`,{method:"DELETE"});render();});
    row.appendChild(x);
    host.appendChild(row);
  });
  $("#visionline").textContent = S.vision
    ? "Reading an image reconstructs its prompt and splits it into fragments."
    : "Cannot read images: " + (S.vision_why||"no model connected") +
      ". Palettes still work — everything else needs a model.";
  $("#readall").disabled = !S.vision || !refs.length;
}

/* ---------------- the matrix ---------------- */
function fragPill(spec,v,on,onclick,tip){
  const p=el("span","pl"+(on?" on":""));
  if(spec.kind==="color"){ const i=el("i");i.style.background=v;p.appendChild(i);
    p.appendChild(el("span",null,v)); }
  else p.appendChild(el("span",null,String(v)));
  if(onclick){
    p.title=(tip?tip+" — ":"")+(on?"in the genre · click to take it out":"click to put it in the genre");
    p.addEventListener("click",onclick);
  } else p.classList.add("na");
  return p;
}

function renderMatrix(){
  const host=$("#mx"); host.innerHTML="";
  const refs=S.patch.refs||[];
  if(!refs.length){
    host.appendChild(el("div","empty",
      "Drop reference images on the left. Each one is taken apart into the fragments "+
      "of the prompt that would produce it, and the genre is whichever fragments you keep."));
    return;
  }
  const t=el("table","mx");
  const thead=el("thead"), hr=el("tr");
  hr.appendChild(el("th","rowh"));
  refs.forEach(r=>{
    const th=el("th"); const c=el("div","colh");
    const img=document.createElement("img");
    img.src=`/api/genre/${GID}/reference/${r.id}/image`; img.alt="";
    c.appendChild(img);
    c.appendChild(el("div","cn",r.name||r.id));
    const cov=(S.coverage||{})[r.id]||{};
    c.appendChild(el("div","cg",`${cov.answered||0}/${cov.of||0} rows answered`));
    const bar=el("div","cbtn");
    const all=el("button","btn2 ghost sm","take all");
    all.addEventListener("click",()=>check(r.id,true));
    const none=el("button","btn2 ghost sm","none");
    none.addEventListener("click",()=>check(r.id,false));
    bar.appendChild(all); bar.appendChild(none);
    c.appendChild(bar);
    th.appendChild(c); hr.appendChild(th);
  });
  const cth=el("th","comb-cell"); cth.appendChild(combinedHead());
  hr.appendChild(cth); thead.appendChild(hr); t.appendChild(thead);

  const tb=el("tbody");
  S.groups.forEach(g=>{
    const rowsIn=(S.row_defs||[]).filter(a=>a.group===g.key);
    if(!rowsIn.length) return;
    const band=el("tr","band"); const bt=el("td");
    bt.colSpan=refs.length+2;
    bt.appendChild(el("span","gs-lbl",g.label));
    band.appendChild(bt); tb.appendChild(band);

    rowsIn.forEach(spec=>{
      const row=S.rows[spec.key]; if(!row) return;
      const tr=el("tr");
      const rh=el("td","rowh");
      rh.appendChild(el("span","rl",spec.label));
      // completeness, per row: how many images offered anything here
      rh.appendChild(el("span","rc",
        row.offered ? `${row.offered} of ${row.of} images` : "nothing offered"));
      if(spec.hint) rh.appendChild(el("span","rh",spec.hint));
      tr.appendChild(rh);

      refs.forEach(r=>{
        const td=el("td");
        const box=el("div","cellv");
        const on=checked(r.id,spec.key);
        const list=offers(r.id,spec.key);
        if(!list.length) box.appendChild(el("span","emptyc","—"));
        list.forEach(v=>{
          const isOn=on.includes(v);
          box.appendChild(fragPill(spec,v,isOn,()=>{
            const next=isOn?on.filter(x=>x!==v):on.concat([v]);
            patch({sel:{[r.id]:{[spec.key]:next}}});
          },spec.kind==="color"?swatchName(r,v):null));
        });
        td.appendChild(box); tr.appendChild(td);
      });

      tr.appendChild(combinedCell(spec,row));
      tb.appendChild(tr);
    });
  });
  t.appendChild(tb); host.appendChild(t);
}
function swatchName(ref,hex){
  const c=(ref.colors||[]).find(c=>c.hex===hex); return c?c.name:null;
}
async function check(rid,on){
  S=await post(`/api/genre/${GID}/reference/${rid}/check`,{on}); render();
}

/* the combined cell: what is in the genre for this row. Every chip can be taken
   out; a palette chip can also be marked as the accent; and every row takes a
   fragment of your own. */
function combinedCell(spec,row){
  const td=el("td","comb-cell");
  const box=el("div","cellv");
  (row.chips||[]).forEach(c=>{
    const isAcc=spec.kind==="color"&&S.patch.accent===c.value;
    const chip=el("span","chip"+(c.own?" own":"")+(isAcc?" acc":""));
    if(spec.kind==="color"){
      const sw=el("span","sw"); const i=el("i"); i.style.background=c.value;
      sw.appendChild(i);
      sw.title=isAcc?"the accent · click to unmark":"click to mark as the accent";
      sw.addEventListener("click",()=>patch({accent:isAcc?"":c.value}));
      chip.appendChild(sw);
      chip.appendChild(el("span",null,c.value));
      if(isAcc) chip.appendChild(el("span","star","ACCENT"));
    }else{
      chip.appendChild(el("span",null,c.value));
    }
    const x=el("button","x","✕");
    x.title="take this out of the genre";
    x.addEventListener("click",()=>removeChip(spec,c));
    chip.appendChild(x);
    box.appendChild(chip);
  });
  const add=el("button","addpl","+");
  add.title="add a fragment of your own";
  add.addEventListener("click",()=>openAdd(add,spec));
  box.appendChild(add);
  td.appendChild(box);
  return td;
}

/* removing a chip unchecks it wherever it came from, so the matrix and the
   combined column can never disagree about what is in the genre */
function removeChip(spec,chip){
  const body={};
  if(chip.refs&&chip.refs.length){
    body.sel={};
    chip.refs.forEach(rid=>{
      body.sel[rid]={[spec.key]:checked(rid,spec.key).filter(v=>v!==chip.value)};
    });
  }
  if(chip.own){
    const own=(S.patch.own||{})[spec.key]||[];
    body.own={[spec.key]:own.filter(v=>v!==chip.value)};
  }
  if(spec.kind==="color"&&S.patch.accent===chip.value) body.accent="";
  patch(body);
}

function openAdd(anchor,spec){
  const inp=document.createElement("input");
  inp.className="addin";
  inp.placeholder=spec.kind==="color"?"#rrggbb":"a fragment";
  anchor.replaceWith(inp);
  inp.focus();
  const done=commit=>{
    const v=inp.value.trim();
    inp.replaceWith(anchor);
    if(!commit||!v) return;
    const own=(S.patch.own||{})[spec.key]||[];
    if(own.includes(v)) return;
    patch({own:{[spec.key]:own.concat([v])}});
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter") done(true);
    if(e.key==="Escape") done(false);
  });
  inp.addEventListener("blur",()=>done(true));
}

/* ---- the combined column head: the genre made visible ---- */
function combinedHead(){
  const w=el("div","comb");
  w.appendChild(el("span","gs-lbl","→ the genre"));
  const gens=S.patch.generations||[];
  const last=gens[gens.length-1];
  if(last){
    const img=document.createElement("img");
    img.className="comb-img";
    img.src=`/api/genre/${GID}/generation/${last.id}/image`;
    img.title="the latest take — click to open full size";
    img.addEventListener("click",()=>window.open(img.src,"_blank","noopener"));
    w.appendChild(img);
  }else{
    w.appendChild(el("div","comb-empty",
      "no take yet — render one from what is in the genre"));
  }
  const bar=el("div","rowbtn");
  const b=el("button","btn2 sm",gens.length?"Regenerate":"Generate");
  b.id="gen-btn";
  if(!(S.generate||{}).ok){ b.disabled=true; b.title=(S.generate||{}).reason||""; }
  b.addEventListener("click",doGenerate);
  bar.appendChild(b);
  if(last){
    // the feedback loop: a take goes back in as a reference and is taken apart
    const p=el("button","btn2 ghost sm","Use as reference");
    p.title="add this take to the matrix and decompose it like any other image";
    p.disabled=(S.patch.refs||[]).length>=S.max_refs;
    if(p.disabled) p.title=`the patch is full at ${S.max_refs} references`;
    p.addEventListener("click",()=>promote(last.id));
    bar.appendChild(p);
  }
  w.appendChild(bar);
  if(!(S.generate||{}).ok)
    w.appendChild(el("div","gs-hint",(S.generate||{}).reason||""));
  if(gens.length>1){
    const hist=el("div","gen-hist");
    gens.slice(0,-1).slice(-6).forEach(g=>{
      const t=document.createElement("img");
      t.src=`/api/genre/${GID}/generation/${g.id}/image`;
      t.title="earlier take — click to open";
      t.addEventListener("click",()=>window.open(t.src,"_blank","noopener"));
      hist.appendChild(t);
    });
    w.appendChild(hist);
  }
  const pt=el("div","comb-ptoggle","recipe ▾");
  const pbox=document.createElement("textarea");
  pbox.className="comb-prompt";
  pbox.placeholder=(S.recipe||"").slice(0,900);
  pbox.value=S.patch.gen_prompt||"";
  pbox.title="composed from what is in the genre — type here to use your own words instead";
  pbox.style.display="none";
  pt.addEventListener("click",()=>{
    pbox.style.display=pbox.style.display==="none"?"block":"none";});
  pbox.addEventListener("change",()=>patch({gen_prompt:pbox.value}));
  w.appendChild(pt); w.appendChild(pbox);
  return w;
}
async function doGenerate(){
  const b=$("#gen-btn"); if(!b||b.disabled)return;
  b.disabled=true; b.textContent="Rendering…";
  try{ const out=await post(`/api/genre/${GID}/generate`,{});
    S=out.state; render(); }
  catch(e){ b.disabled=false; b.textContent="Regenerate";
    alert("Could not render: "+e.message); }
}
async function promote(genid){
  try{ const out=await post(`/api/genre/${GID}/generation/${genid}/promote`);
    S=out.state; render(); }
  catch(e){ alert("Could not use that take: "+e.message); }
}

/* ---------------- the deliverable ---------------- */
function renderExport(){
  const m=S.manifest||{};
  const kept=Object.values(S.rows||{}).reduce((n,r)=>n+(r.chips||[]).length,0);
  const cols=(m.palette&&m.palette.colors||[]).length;
  $("#sumline").textContent=
    `${kept} fragment${kept===1?"":"s"} · ${cols} colour${cols===1?"":"s"} · `+
    `${(S.patch.generations||[]).length} take${(S.patch.generations||[]).length===1?"":"s"}`;
  $("#dl").setAttribute("href",`/api/genre/${GID}/manifest`);
}
async function copyRecipe(){
  const text=(S.patch.gen_prompt||"").trim()||S.recipe||"";
  const b=$("#copyrecipe");
  try{
    if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(text);
    else{ // plain http over the tailnet has no clipboard API
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    b.textContent="Copied"; setTimeout(()=>{b.textContent="Copy recipe";},1400);
  }catch(e){ b.textContent="Copy failed"; setTimeout(()=>{b.textContent="Copy recipe";},1800); }
}

function render(){
  renderRefs(); renderMatrix(); renderExport();
  const n=$("#pname");
  if(document.activeElement!==n) n.textContent=S.patch.name||"Untitled genre";
}

/* ---------------- uploads ---------------- */
async function addFiles(list){
  for(const f of Array.from(list).slice(0,S.max_refs)){
    if(!f.type.startsWith("image/")) continue;
    const url=await new Promise(res=>{const r=new FileReader();
      r.onload=()=>res(r.result);r.readAsDataURL(f);});
    try{ const out=await post(`/api/genre/${GID}/reference`,{data_url:url,name:f.name});
      S=out.state; render(); }
    catch(e){ alert("Could not add "+f.name+": "+e.message); }
  }
}
const drop=$("#drop");
drop.addEventListener("click",()=>$("#file").click());
$("#file").addEventListener("change",e=>addFiles(e.target.files));
["dragenter","dragover"].forEach(k=>drop.addEventListener(k,e=>{
  e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(k=>drop.addEventListener(k,e=>{
  e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));

$("#pname").addEventListener("blur",()=>patch({name:$("#pname").textContent.trim()}));
$("#copyrecipe").addEventListener("click",copyRecipe);
$("#readall").addEventListener("click",async()=>{
  const b=$("#readall"); b.disabled=true; b.textContent="Reading…";
  await post(`/api/genre/${GID}/read-all`);
  let n=0; const t=setInterval(async()=>{
    await refresh(); n++;
    if(n>24||(S.patch.refs||[]).every(r=>r.rung===2)){clearInterval(t);
      b.textContent="Read the images"; b.disabled=!S.vision;}
  },2500);
});

boot().catch(e=>{document.body.innerHTML=
  '<div class="empty">Could not open the studio: '+e.message+"</div>";});
</script>
</body>
